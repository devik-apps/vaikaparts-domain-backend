import org.apache.tools.ant.taskdefs.condition.Os
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.21.0'
}

java {
    group = 'com.devikapps'
    version = '1.0.0'
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/devik-apps/vaikaparts-domain-backend")
        credentials {
            username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
            password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: ""
        }
    }

    maven {
        name = "VaikapartsPecuniaRepo"
        url = uri("https://maven.pkg.github.com/devik-apps/vaikaparts-pecunia")
        credentials {
            username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
            password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: ""
        }
    }
    mavenCentral()
}

def resolveClientVersion() {
    if (project.hasProperty('clientVersion')) {
        def explicit = project.property('clientVersion') as String
        logger.info("[vaikaparts-gen] Using explicitly provided clientVersion: ${explicit}")
        return explicit
    }

    def cacheFile = layout.buildDirectory.file("client-version.txt").get().asFile
    if (cacheFile.exists()) {
        def cached = cacheFile.text.trim()
        if (!cached.isEmpty()) {
            logger.info("[vaikaparts-gen] Using cached client version: ${cached}")
            return cached
        }
    }

    logger.warn("[vaikaparts-gen] No cached version found. Run './gradlew resolveClientVersion' or falling back to LOCAL-SNAPSHOT.")
    return "0.0.0-LOCAL-SNAPSHOT"
}


