tasks.named('test') {
    useJUnitPlatform()

    systemProperty "testcontainers.reuse.enable", "true"
    systemProperty "testcontainers.cleanup.enabled", "true"
    systemProperty "testcontainers.checks.disable", "true"


    jvmArgs(
            '-XX:+EnableDynamicAgentLoading',
            '-Djdk.instrument.traceUsage=false',
            '-Xshare:off'
    )

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

tasks.register('resolveClientVersion') {
    description = 'Resolves and caches the latest published vaikaparts-gen version from GitHub Packages.'
    group = 'build setup'

    def outputFile = layout.buildDirectory.file("client-version.txt")
    outputs.file(outputFile)

    doLast {
        def githubToken = (System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: "") as String

        if (githubToken.isEmpty()) {
            def fallback = "0.0.0-LOCAL-SNAPSHOT"
            logger.warn("[vaikaparts-gen] GITHUB_TOKEN is not set. Writing fallback version: ${fallback}")
            outputFile.get().asFile.text = fallback
            return
        }

        def resolved = fetchLatestVersionFromGitHubPackages(githubToken)
        outputFile.get().asFile.text = resolved
        logger.lifecycle("[vaikaparts-gen] Resolved and cached client version: ${resolved}")
    }
}

def fetchLatestVersionFromGitHubPackages(String githubToken) {
    def githubOrg = System.getenv("GITHUB_ORG") ?: (project.findProperty("gpr.org") ?: "devik-apps") as String
    try {
        URI uri = URI.create("https://api.github.com/orgs/${githubOrg}/packages/maven/com.devikapps.vaikaparts-gen/versions")
        HttpURLConnection connection = (HttpURLConnection) uri.toURL().openConnection()
        connection.setRequestMethod("GET")
        connection.setRequestProperty("Authorization", "Bearer ${githubToken}")
        connection.setRequestProperty("Accept", "application/vnd.github+json")
        connection.setRequestProperty("X-GitHub-Api-Version", "2022-11-28")
        connection.connectTimeout = 5000
        connection.readTimeout = 5000

        if (connection.responseCode != 200) {
            logger.warn("[vaikaparts-gen] GitHub Packages API returned HTTP ${connection.responseCode}. Falling back to LOCAL-SNAPSHOT.")
            return "0.0.0-LOCAL-SNAPSHOT"
        }

        def response = connection.inputStream.text
        def matcher = response =~ /"name"\s*:\s*"(\d+\.\d+\.\d+)"/

        if (matcher.find()) {
            return matcher.group(1)
        }

        logger.warn("[vaikaparts-gen] No published semantic version found. Falling back to LOCAL-SNAPSHOT.")
        return "0.0.0-LOCAL-SNAPSHOT"

    } catch (Exception e) {
        logger.warn("[vaikaparts-gen] Failed to reach GitHub Packages API: ${e.message}. Falling back to LOCAL-SNAPSHOT.")
        return "0.0.0-LOCAL-SNAPSHOT"
    }
}

tasks.register('generateJavaClient', GenerateTask) {
    generatorName = "java"
    inputSpec = file("${projectDir}/doc/api.yaml").toURI().toString()
    outputDir = layout.buildDirectory.dir("generated/openapi-client").get().asFile.absolutePath
    apiPackage = "com.devikapps.vaikaparts.client.api"
    modelPackage = "com.devikapps.vaikaparts.client.model"
    invokerPackage = "com.devikapps.vaikaparts.client.invoker"

    groupId = "com.devikapps"
    id = "vaikaparts-gen"
    version = "0.0.0-PLACEHOLDER"

    configOptions = [
            serializableModel      : "true",
            serializationLibrary   : "jackson",
            useJakartaEe           : "true",
            dateLibrary            : "java8-localdatetime",
            openApiNullable        : "false",
            hideGenerationTimestamp: "true",
    ]

    library = "restclient"
    skipValidateSpec = false
    logToStderr = true
    generateAliasAsModel = false
    enablePostProcessFile = false
}

tasks.register('generateTypeScriptClient', GenerateTask) {
    generatorName = "typescript-fetch"
    inputSpec = file("${projectDir}/doc/api.yaml").toURI().toString()
    outputDir = layout.buildDirectory.dir("generated/openapi-ts-client").get().asFile.absolutePath

    configOptions = [
            npmName                  : "vaikaparts-gen",
            npmVersion               : "0.0.0-PLACEHOLDER",
            supportsES6              : "true",
            withInterfaces           : "true",
            typescriptThreePlus      : "true",
            hideGenerationTimestamp  : "true",
            useSingleRequestParameter: "true",
            modelPropertyNaming      : "original",
            enumPropertyNaming       : "original",
    ]

    skipValidateSpec = false
    logToStderr = true
    generateAliasAsModel = false
    enablePostProcessFile = false
}

tasks.register('publishClientToMavenLocal', Exec) {
    dependsOn tasks.named('generateJavaClient')

    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine 'cmd', '/c', '.shell\\publish-gen-to-local-maven.bat'
    } else {
        commandLine 'bash', '.shell/publish-gen-to-local-maven.sh'
    }
}


tasks.named('compileJava') {
    if (!project.hasProperty('skipClientPublish')) {
        dependsOn tasks.named('publishClientToMavenLocal')
    }
}
