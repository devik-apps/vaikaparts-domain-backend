      example:
        schema: public
        record: ""
        old_record: ""
        type: INSERT
        table: profiles
      properties:
        type:
          description: The type of database operation that triggered the webhook
          enum:
            - INSERT
            - UPDATE
            - DELETE
          type: string
        table:
          description: The table name (always 'profiles' for this webhook)
          example: profiles
          type: string
        schema:
          description: The schema name (always 'public' for this webhook)
          example: public
          type: string
        record:
          allOf:
            - $ref: "#/components/schemas/SupabaseProfileRecord"
          description: The new/current record data (null for DELETE operations)
          nullable: true
        old_record:
          allOf:
            - $ref: "#/components/schemas/SupabaseProfileRecord"
          description: "The previous record data (null for INSERT operations, present for UPDATE and DELETE)"
          nullable: true
      required:
