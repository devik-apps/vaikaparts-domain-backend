openapi: 3.1.0
info:
  contact:
    email: vaikaparts@gmail.com
    name: Devik'Apps Development Team
    url: https://devikapps.com
  description: |
    ## Overview

    The VaikaParts Core Domain API provides the foundational business logic and data management capabilities for the VaikaParts automotive parts marketplace platform. This API serves as the central domain service responsible for managing user profiles, auto parts demands, seller offers, contact exchange workflows, and notification systems.

    ## Architecture

    This API represents the core domain microservice within the VaikaParts distributed system architecture. It handles business logic and data persistence while integrating with external services through well-defined interfaces:

    - **Authentication Provider**: Supabase Auth via JWT token validation and webhook integration
    - **Payment Processing**: External Payment Service via webhook callbacks
    - **Storage**: S3-compatible object storage for profile photos and attachment URLs
    - **Messaging**: Event-driven notification system supporting multiple channels

    ## Domain Model

    The core domain encompasses the following primary entities:

    ### Users
    - **Researchers**: End users searching for automotive parts
    - **Sellers**: Vendors offering automotive parts for sale
    - **Managers**: Administrative users with platform oversight capabilities

    ### Business Entities
    - **Demands**: Researcher requests for specific automotive parts
    - **Offers**: Seller responses to Researcher demands with pricing and availability
    - **Parts**: Structured automotive part specifications
    - **Contact Unlocks**: Paid contact information exchange transactions
    - **Ratings**: Seller performance and reliability feedback
    - **Premium Subscriptions**: Enhanced seller features and notifications

    ## Privacy and Data Protection

    The API implements a privacy-first architecture where personally identifiable information (PII) is conditionally exposed based on business rules:

    ### Anonymous Profile Model

    By default, all user profiles are presented in an anonymized format:
    - Profile photographs are masked or replaced with placeholder images
    - Location data is generalized to city and region level only
    - Contact information (names, phone numbers, addresses) is withheld
    - Only aggregate statistics and ratings are publicly visible

    ### Contact Information Disclosure

    Full contact details are revealed exclusively under the following conditions:
    - A Researcher has completed payment for a specific contact unlock transaction
    - The unlock status has been confirmed by the Payment Service
    - The requesting user is authorized to access the information
    - Administrative users with appropriate permissions

    Each contact unlock transaction is scoped to a single offer. Subsequent offers from the same seller require separate unlock transactions, ensuring fair monetization and privacy protection.

    ## Business Workflow

    ### Standard Transaction Flow

    1. **Demand Creation**: Researcher creates a demand specifying part requirements
    2. **Seller Notification**: System notifies relevant sellers based on matching criteria
    3. **Offer Submission**: Sellers respond with offers including pricing and conditions
    4. **Offer Review**: Researcher reviews anonymous offers with masked seller information
    5. **Contact Unlock Initiation**: Researcher selects an offer and initiates unlock request
    6. **Payment Processing**: External Payment Service handles transaction
    7. **Contact Revelation**: Upon payment confirmation, full contact details are revealed
    8. **Transaction Confirmation**: Researcher confirms receipt and satisfaction within 48 hours
    9. **Rating Submission**: Researcher rates seller performance

    ### Premium Seller Features

    Sellers may subscribe to premium tiers offering:
    - Priority placement in seller notification queues
    - Extended notification channel access (SMS, email in addition to push)
    - Premium badge display on anonymous profiles
    - Enhanced visibility in offer listings

    ## Integration Points

    ### Supabase Authentication

    The API validates JWT tokens issued by Supabase Auth and receives user lifecycle events via webhooks:
    - User creation triggers profile initialization
    - User updates synchronize metadata
    - User deletion triggers account deactivation

    ### Payment Service Integration

    The Payment Service communicates transaction outcomes via authenticated webhooks:
    - Contact unlock payment confirmation
    - Premium subscription activation and renewal
    - Refund processing notifications

    ## Support

    For technical support, integration assistance, or to report issues, contact the development team at vaikaparts@gmail.com.
  title: VaikaParts Core Domain API
  version: 1.0.0
servers:
  - description: Pre-production environment
    url: https://vaikaparts-domain-backend.onrender.com
  - description: Local development environment
    url: http://localhost:9090
security:
  - supabaseAuth: []
tags:
  - description: System health and monitoring endpoints
    name: Health
  - description: External service integration webhooks
    name: Webhooks
  - description: User profile management operations
    name: Users
  - description: Researcher-specific operations
    name: Researchers
  - description: Seller-specific operations
    name: Sellers
  - description: Administrative operations
    name: Managers
  - description: Automotive parts demand management
    name: Demands
  - description: Seller offer management
    name: Offers
  - description: File upload operations
    name: Storage
  - description: All about notifications
    name: Notifications
paths:
  /:
    get:
      operationId: rootRedirect
      responses:
        "302":
          description: Redirects to /doc
          headers:
            Location:
              description: URL to redirect
              explode: false
              schema:
                example: /doc
                type: string
              style: simple
      summary: Redirect root path to Swagger UI
      tags:
        - Docs
      x-accepts:
        - application/json
  /ping:
    get:
      operationId: pong
      responses:
        "200":
          content:
            application/json:
              schema:
                example: pong
                type: string
          description: A message showing that the server is alive
      summary: Check if the server is alive
      tags:
        - Health
      x-accepts:
        - application/json
  /health/bucket:
    get:
      description: |
        This endpoint uploads a randomly generated text file to the storage bucket,  verifies its content by downloading it, and returns a presigned URL for the file.
      operationId: healthBucketCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                example: https://unfaked-bucket.s3.amazonaws.com/health/uuid.txt?X-Amz-Signature=...
                type: string
          description: "Successfully uploaded, verified, and presigned file."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/healthBucketCheck_500_response"
          description: Uploaded and downloaded content mismatch or other error occurred.
      summary: "Check bucket health by uploading, downloading, and presigning a file"
      tags:
        - Health
      x-accepts:
        - application/json
  /health/email:
    get:
      description: Sends a test email to verify email service functionality
      operationId: sendHealthEmail
      parameters:
        - description: Email address to send the health check email to
          explode: true
          in: query
          name: to
          required: true
          schema:
            format: email
            type: string
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                example: Email sent successfully
                type: string
          description: Email sent successfully
        "400":
          content:
            application/json:
              example:
                timestamp: 2025-11-04T10:30:00Z
                status: 400
                error: Bad Request
                message: Invalid email address format
                path: /health/email
                errorCode: BAD_FORM
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid email address format
      security: []
      summary: Send health check email
      tags:
        - Health
      x-accepts:
        - application/json
  /health/message:
    get:
      description: |
        This endpoint triggers one or more dummy events through the event producer  for testing the messaging system (e.g., RabbitMQ or Kafka).
      operationId: triggerDummyEvents
      parameters:
        - description: Number of events to trigger (1–500)
          explode: true
          in: query
          name: nbEvent
          required: false
          schema:
            default: 1
            maximum: 500
            minimum: 1
            type: integer
          style: form
        - description: Duration (in seconds) to simulate event processing
          explode: true
          in: query
          name: waitInSeconds
          required: false
          schema:
            default: 2
            minimum: 1
            type: integer
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                example:
                  - c91f2c9b-9c8e-4e7f-84e2-09c95edff3e4
                  - 51af4d2b-745a-465d-b9a2-bf0b1c1ffb23
                items:
                  type: string
                type: array
          description: List of UUIDs corresponding to triggered dummy events
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/triggerDummyEvents_400_response"
          description: "Invalid parameter values (e.g., nbEvent not in 1–500)"
      summary: Trigger dummy health check events
      tags:
        - Health
      x-accepts:
        - application/json
  /health/db:
    get:
      description: Returns a paginated list of Dummy entities.
      parameters:
        - description: Page number (0-based)
          explode: true
          in: query
          name: page
          required: false
          schema:
            default: 0
            type: integer
          style: form
        - description: Page size
          explode: true
          in: query
          name: size
          required: false
          schema:
            default: 10
            type: integer
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_health_db_get_200_response"
          description: Successful database health check
      summary: Health check for the dummy database
      tags:
        - Health
      x-accepts:
        - application/json
  /v1/webhooks/spb/auth:
    post:
      description: |
        Receives database lifecycle events from Supabase Database Webhooks and synchronizes user profile data with the VaikaParts domain model.

        This endpoint handles all Supabase Database webhook events for the public.profiles table:
        - **INSERT**: Creates a new Researcher, Seller, or Manager profile based on user_metadata.user_type
        - **UPDATE**: Synchronizes metadata changes to the existing user profile
        - **DELETE**: Soft-deletes the user profile by setting status to DISABLED

        The user type (RESEARCHER, SELLER, MANAGER) is determined from the record.user_metadata.user_type field.
        If not specified, defaults to RESEARCHER.

        **Authentication**: Requests must include a valid Supabase webhook signature or secret token in the Authorization header.
      operationId: supabaseProfileWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupabaseDatabaseWebhook"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/supabaseProfileWebhook_200_response"
          description: Webhook processed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid webhook signature or authorization token
        "500":
          description: Internal server error during webhook processing
      security:
        - supabaseWebhookSignature: []
      summary: Supabase Database webhook handler for profiles table
      tags:
        - Webhooks
      x-content-type: application/json
      x-accepts:
        - application/json
  /users/me:
    get:
      description: Returns the complete profile of the currently authenticated user based on the Supabase JWT token provided in the request.
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCurrentUser_200_response"
          description: User profile retrieved successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: Retrieve current authenticated user profile
      tags:
        - Users
      x-accepts:
        - application/json
  /users/me/profile-photo:
    delete:
      description: Deletes the current profile photograph from storage and removes the URL from the user profile.
      operationId: deleteProfilePhoto
      responses:
        "204":
          description: Profile photograph deleted successfully
      summary: Remove user profile photograph
      tags:
        - Users
        - Storage
      x-accepts:
        - application/json
    post:
      description: |
        Uploads a profile photograph to S3 storage and updates the user profile with the resulting URL. The photograph will be displayed in an anonymized format (blurred or masked) in public contexts until a contact unlock transaction is completed.

        **File Requirements**:
        - Formats: JPEG, PNG
        - Maximum size: 5 MB
        - Recommended dimensions: 400x400 pixels minimum
      operationId: uploadProfilePhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadProfilePhoto_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadProfilePhoto_200_response"
          description: Profile photograph uploaded successfully
        "400":
          description: Invalid file format or size exceeds limit
      summary: Upload user profile photograph
      tags:
        - Users
        - Storage
      x-content-type: multipart/form-data
      x-accepts:
        - application/json
  /researchers:
    get:
      description: |
        Returns a paginated list of all Researcher profiles in the system.

        **Authorization**: Manager role required.
      operationId: getResearchers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearcherPageResponse"
          description: Researcher list retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: List all Researcher profiles
      tags:
        - Researchers
      x-accepts:
        - application/json
  /researchers/me:
    get:
      description: Returns the complete profile of the currently authenticated Researcher.
      operationId: getCurrentResearcher
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Researcher"
          description: Researcher profile retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a Researcher.
      summary: Retrieve the currently authenticated Researcher profile
      tags:
        - Researchers
      x-accepts:
        - application/json
  /researchers/{researcherId}:
    get:
      description: |
        Returns the complete profile of a specific Researcher identified by UUID.

        **Authorization**: Manager role required
      operationId: getResearcherById
      parameters:
        - description: Unique identifier of the Researcher
          explode: false
          in: path
          name: researcherId
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
          style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Researcher"
          description: Researcher profile retrieved successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Retrieve Researcher profile by ID
      tags:
        - Researchers
      x-accepts:
        - application/json
  /sellers/me:
    get:
      description: |
        Returns the complete profile of the currently authenticated Seller including
        all contact details.

        **Authorization**: Seller role required.
      operationId: getCurrentSeller
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"
          description: Seller profile retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a Seller.
      summary: Retrieve the currently authenticated Seller profile
      tags:
        - Sellers
      x-accepts:
        - application/json
  /sellers:
    get:
      description: |
        Returns a paginated list of all Seller profiles in the system.

        **Authorization**: Manager role required.
      operationId: getSellers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerPageResponse"
          description: Seller list retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: List all Seller profiles
      tags:
        - Sellers
      x-accepts:
        - application/json
  /managers/me:
    get:
      description: |
        Returns the complete profile of the currently authenticated Manager.

        **Authorization**: Manager role required.
      operationId: getCurrentManager
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manager"
          description: Manager profile retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Authenticated user is not a Manager.
      summary: Retrieve the currently authenticated Manager profile
      tags:
        - Managers
      x-accepts:
        - application/json
  /managers:
    get:
      description: |
        Returns a paginated list of all Manager profiles in the system.

        **Authorization**: Manager role required.
      operationId: getManagers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerPageResponse"
          description: Manager list retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: List all Manager profiles
      tags:
        - Managers
      x-accepts:
        - application/json
  /v1/demands:
    get:
      description: |
        Returns a paginated list of demands belonging to the authenticated Researcher.
        Results may be narrowed by lifecycle status.

        **Authorization**: Researcher role required.
      operationId: getResearcherDemands
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - description: Filter by demand lifecycle status. Omit to return all statuses.
          explode: true
          in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/DemandStatus"
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandPageResponse"
          description: Demand list retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: List researcher demands with optional status filtering
      tags:
        - Demands
      x-accepts:
        - application/json
    post:
      description: |
        Creates a new demand on behalf of the authenticated Researcher. The request
        is submitted as `multipart/form-data`. Part fields are bound using Spring
        dot-notation (`part.name`, `part.carBrand`, etc.). Images are optional and
        bound under `part.images`; maximum 5 files per demand.

        **Authorization**: Researcher role required.
      operationId: createDemand
      requestBody:
        content:
          multipart/form-data:
            encoding:
              part.images:
                contentType: "image/jpeg, image/png, image/webp"
                style: form
            schema:
              $ref: "#/components/schemas/DemandCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"
          description: Demand created successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Create a new automotive parts demand
      tags:
        - Demands
      x-content-type: multipart/form-data
      x-accepts:
        - application/json
  /v1/demands/{demandId}:
    get:
      description: |
        Returns the full detail view for a single demand. Access is restricted to
        the owning Researcher — requests for demands belonging to another principal
        return 404 to prevent information disclosure.

        **Authorization**: Researcher role required.
      operationId: getDemandById
      parameters:
        - description: Unique identifier of the demand.
          explode: false
          in: path
          name: demandId
          required: true
          schema:
            type: string
          style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"
          description: Demand retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Retrieve a demand by its identifier
      tags:
        - Demands
      x-accepts:
        - application/json
  /v1/demands/{demandId}/status:
    patch:
      description: |
        Transitions the demand to a new lifecycle status. Only permitted
        status transitions are accepted; invalid transitions return 400.

        **Authorization**: Researcher role required.
      operationId: updateDemandStatus
      parameters:
        - description: Unique identifier of the demand.
          explode: false
          in: path
          name: demandId
          required: true
          schema:
            type: string
          style: simple
        - description: Target lifecycle status to apply to the demand.
          explode: true
          in: query
          name: status
          required: true
          schema:
            $ref: "#/components/schemas/DemandStatus"
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"
          description: Demand status updated successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Update the lifecycle status of a demand
      tags:
        - Demands
      x-accepts:
        - application/json
  /v1/demands/{demandId}/offers:
    get:
      description: |
        Returns a paginated list of all offers submitted in response to the
        specified demand. Access is restricted to the demand owner.

        **Authorization**: Researcher role required.
      operationId: getOffersForDemand
      parameters:
        - description: Unique identifier of the demand.
          explode: false
          in: path
          name: demandId
          required: true
          schema:
            type: string
          style: simple
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPageResponse"
          description: Offer list retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Retrieve paginated offers submitted for a specific demand
      tags:
        - Demands
        - Offers
      x-accepts:
        - application/json
  /v1/offers:
    get:
      description: |
        Returns a paginated list of offers submitted by the currently authenticated
        seller. Results may be narrowed by lifecycle status.

        **Authorization**: Seller role required.
      operationId: getSellerOffers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - description: Filter by offer lifecycle status. Omit to return all statuses.
          explode: true
          in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/OfferStatus"
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPageResponse"
          description: Offer list retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: List offers submitted by the authenticated seller
      tags:
        - Offers
      x-accepts:
        - application/json
    post:
      description: |
        Creates a new offer on behalf of the authenticated seller. The request is
        submitted as `multipart/form-data`. Part info fields are bound using Spring
        dot-notation (`part_info.name`, `part_info.car_brand`, etc.). Images are
        optional and bound under `part_info.images`; maximum 5 files per offer.

        **Authorization**: Seller role required.
      operationId: createOffer
      requestBody:
        content:
          multipart/form-data:
            encoding:
              part_info.images:
                contentType: "image/jpeg, image/png, image/webp"
                style: form
            schema:
              $ref: "#/components/schemas/OfferCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
          description: Offer created successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Demand not found.
      summary: Submit a new offer in response to a demand
      tags:
        - Offers
      x-content-type: multipart/form-data
      x-accepts:
        - application/json
  /v1/offers/{offerId}:
    get:
      description: |
        Returns the full detail view for a single offer. Access is restricted to
        the owning seller — requests for offers belonging to another principal
        return 404 to prevent information disclosure.

        **Authorization**: Seller role required.
      operationId: getOfferById
      parameters:
        - description: Unique identifier of the offer.
          explode: false
          in: path
          name: offerId
          required: true
          schema:
            type: string
          style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
          description: Offer retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Retrieve an offer by its identifier
      tags:
        - Offers
      x-accepts:
        - application/json
  /v1/offers/{offerId}/status:
    patch:
      description: |
        Transitions the offer to a new lifecycle status. Only permitted
        status transitions are accepted; invalid transitions return 400.

        **Authorization**: Seller role required.
      operationId: updateOfferStatus
      parameters:
        - description: Unique identifier of the offer.
          explode: false
          in: path
          name: offerId
          required: true
          schema:
            type: string
          style: simple
        - description: Target lifecycle status to apply to the offer.
          explode: true
          in: query
          name: status
          required: true
          schema:
            $ref: "#/components/schemas/OfferStatus"
          style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
          description: Offer status updated successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Update the lifecycle status of an offer
      tags:
        - Offers
      x-accepts:
        - application/json
  /v1/offers/demand/{demandId}:
    get:
      description: |
        Returns a paginated list of offers submitted in response to the specified
        demand, as visible to the authenticated seller.

        **Authorization**: Seller role required.
      operationId: getOffersByDemandId
      parameters:
        - description: Unique identifier of the demand.
          explode: false
          in: path
          name: demandId
          required: true
          schema:
            type: string
          style: simple
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferPageResponse"
          description: Offer list retrieved successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Retrieve paginated offers associated with a specific demand
      tags:
        - Offers
      x-accepts:
        - application/json
  /v1/notifications:
    get:
      description: Returns a paginated list of notifications for the current active seller.
      operationId: fetchNotifications
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPageResponse"
          description: Notifications retrieved successfully
      summary: Retrieve seller notifications
      tags:
        - Notifications
      x-accepts:
        - application/json
  /v1/notifications/mark-as-read/{notificationId}:
    patch:
      description: Updates the read status of a specific notification.
      operationId: markAsRead
      parameters:
        - description: Unique identifier of the notification
          explode: false
          in: path
          name: notificationId
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
          style: simple
      responses:
        "202":
          content:
            appliction/json:
              schema:
                $ref: "#/components/schemas/Notification"
          description: Notification marked as read
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Mark notification as read
      tags:
        - Notifications
      x-accepts:
        - application/json
        - appliction/json
  /v1/notifications/{notificationId}:
    get:
      description: This endpoints allows sellers to fetch the notifications object with the given id.
      operationId: getNotification
      parameters:
        - description: Unique identifier of the notification
          explode: false
          in: path
          name: notificationId
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
          style: simple
      responses:
        "202":
          content:
            appliction/json:
              schema:
                $ref: "#/components/schemas/Notification"
          description: Fetched notification with the corresponding given id
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Get notification with given id
      tags:
