server:
  port: ${PORT:8080}
vaikaparts:
  frontend-base-url: ${VAIKAPARTS_FRONTEND_BASE_URL:https://vaikaparts.com}
notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
  sms:
    enabled: ${NOTIFICATIONS_SMS_ENABLED:false}
    connect-timeout: ${SMS_CONNECT_TIMEOUT:5s}
    request-timeout: ${SMS_REQUEST_TIMEOUT:10s}
    befiana:
      base-url: ${BEFIANA_SMS_BASE_URL:}
      api-key: ${BEFIANA_SMS_API_KEY:}
contact-release:
  rabbit:
    retry:
      max-attempts: ${CONTACT_RELEASE_RETRY_MAX_ATTEMPTS:3}
      initial-interval: ${CONTACT_RELEASE_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${CONTACT_RELEASE_RETRY_MULTIPLIER:2.0}
      max-interval: ${CONTACT_RELEASE_RETRY_MAX_INTERVAL_MS:10000}
contact-unlock:
  price-mga: ${CONTACT_UNLOCK_PRICE_MGA:5000}
  manual:
    orange-money-number: ${CONTACT_UNLOCK_ORANGE_MONEY_NUMBER:}
pecunia:
  base-url: ${PECUNIA_BASE_URL:}
  api-key: ${PECUNIA_API_KEY:}
  connect-timeout: ${PECUNIA_CONNECT_TIMEOUT:5s}
  request-timeout: ${PECUNIA_REQUEST_TIMEOUT:10s}
spring:
  jackson:
    serialization:
      write-dates-with-zone-id: false
      write-dates-as-timestamps: false
    time-zone: UTC
  datasource:
    hikari:
      pool-name: HikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      register-mbeans: true
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /doc/api.yaml
