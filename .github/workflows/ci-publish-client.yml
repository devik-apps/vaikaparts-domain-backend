name: CI - Publish Generated Client

on:
  push:
    branches: [ "main" ]
    paths:
      - "doc/api.yaml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check if version already published
        id: version_check
        run: |
          VERSION=$(grep -m1 "version" build.gradle | grep -o '"[^"]*"' | tr -d '"' | head -1)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://maven.pkg.github.com/devik-apps/${{ github.event.repository.name }}/com/devikapps/vaikaparts-gen/${VERSION}/vaikaparts-gen-${VERSION}.pom")
          if [ "$STATUS" == "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version ${VERSION} already exists in GitHub Packages. Skipping publish."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Version ${VERSION} not found. Proceeding with publish."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate client
        if: steps.version_check.outputs.skip == 'false'
        run: ./gradlew generateJavaClient

      - name: Grant execute permission for publish script
        if: steps.version_check.outputs.skip == 'false'
        run: chmod +x .shell/publish_client_to_github_packages.sh

      - name: Publish client to GitHub Packages
        if: steps.version_check.outputs.skip == 'false'
        run: bash .shell/publish_client_to_github_packages.sh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}