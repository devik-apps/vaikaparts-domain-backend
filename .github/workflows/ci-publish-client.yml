name: CI - Publish Generated Client

on:
  push:
    branches: [ "**" ]
    paths:
      - "doc/api.yaml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required: all tags must be present to resolve the latest client version

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate OpenAPI client
        run: ./gradlew generateJavaClient -PskipClientPublish

      - name: Grant execute permission for publish script
        run: chmod +x .shell/publish-gen-to-github-package.sh

      - name: Publish client to GitHub Packages
        run: bash .shell/publish-gen-to-github-package.sh
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Read published version
        id: read_version
        run: |
          VERSION=$(cat build/published-client-version.txt)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Published version: ${VERSION}"

      - name: Write dependency snippets file
        run: |
          VERSION="${{ steps.read_version.outputs.version }}"
          REPO="${{ github.repository }}"
          GROUP="com.devikapps"
          ARTIFACT="vaikaparts-gen"

          cat > build/client-dependency-snippets.txt <<EOF
          Maven:
            <dependency>
              <groupId>${GROUP}</groupId>
              <artifactId>${ARTIFACT}</artifactId>
              <version>${VERSION}</version>
            </dependency>

          Gradle Kotlin DSL:
            implementation("${GROUP}:${ARTIFACT}:${VERSION}")

          Gradle Groovy DSL:
            implementation '${GROUP}:${ARTIFACT}:${VERSION}'

          Repository (Maven/Gradle):
            https://maven.pkg.github.com/${REPO}
          EOF

      - name: Tag commit with published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "client-v${{ steps.read_version.outputs.version }}" "${{ github.sha }}"
          git push origin "client-v${{ steps.read_version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}