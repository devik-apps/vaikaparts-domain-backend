        averageRating:
          type: number
          format: float
        totalRatings:
          type: integer
        responseTime:
          type: object
          properties:
            averageHours:
              type: number
              description: Mean response time to demands
        joinedDate:
          $ref: '#/components/schemas/DateTime'
    PlatformStatistics:
      type: object
      description: Platform-wide aggregate metrics
      properties:
        totalUsers:
          type: integer
        totalResearchers:
          type: integer
        totalSellers:
          type: integer
        totalDemands:
          type: integer
        activeDemands:
          type: integer
        totalOffers:
          type: integer
        totalContactUnlocks:
          type: integer
        paidUnlocks:
          type: integer
        popularCategories:
          type: array
          items:
            type: object
            properties:
              category:
                $ref: '#/components/schemas/PartCategory'
              demandCount:
                type: integer
        topSellers:
          type: array
          items:
            type: object
            properties:
              sellerId:
                $ref: '#/components/schemas/UUID'
              garageName:
                type: string
              successfulUnlocks:
                type: integer
              averageRating:
                type: number
    ResearcherDashboard:
      type: object
      description: Researcher-specific dashboard metrics
      properties:
        totalDemands:
          type: integer
        activeDemands:
          type: integer
        totalOffersReceived:
          type: integer
        completedUnlocks:
          type: integer
        pendingConfirmations:
          type: integer
          description: Unlocks awaiting Researcher confirmation
        recentDemands:
          type: array
          items:
            $ref: '#/components/schemas/Demand'
          maxItems: 5
    SellerDashboard:
      type: object
      description: Seller-specific dashboard metrics
      properties:
        totalOffers:
          type: integer
        pendingOffers:
          type: integer
        selectedOffers:
          type: integer
        completedUnlocks:
          type: integer
        averageRating:
          type: number
        premiumStatus:
          type: object
          properties:
            isActive:
              type: boolean
            expiresAt:
              $ref: '#/components/schemas/DateTime'
              nullable: true
        recentOffers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
          maxItems: 5
    ManagerDashboard:
      type: object
      description: Manager-specific dashboard overview
      properties:
        platformStats:
          $ref: '#/components/schemas/PlatformStatistics'
        recentActivity:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [NEW_DEMAND, NEW_OFFER, UNLOCK_PAID, RATING_CREATED]
              description:
                type: string
              timestamp:
                $ref: '#/components/schemas/DateTime'
          maxItems: 20
    PageResponse:
      type: object
      required: [content, pageable, total_elements, total_pages, last, first, size, number, number_of_elements, empty]
      description: >
        Paginated response wrapper matching the JSON serialization of org.springframework.data.domain.Page. The pagination metadata is nested under the `pageable` object, consistent with Spring Data defaults.

      properties:
        content:
          type: array
          description: Page content — the list of elements for the current page.
          items: {}
        pageable:
          type: object
          description: Pagination state used to produce this page.
          properties:
            page_number:
              type: integer
              description: Zero-based current page index.
            page_size:
              type: integer
              description: Requested number of items per page.
            offset:
              type: integer
              format: int64
              description: Offset of the first element of this page relative to the full result set.
            sort:
              $ref: '#/components/schemas/SortDescriptor'
            paged:
              type: boolean
              description: Whether pagination is applied.
            unpaged:
              type: boolean
              description: Whether pagination is disabled.
        total_elements:
          type: integer
          format: int64
          description: Total number of elements across all pages.
        total_pages:
          type: integer
          description: Total number of pages available.
        last:
          type: boolean
          description: Whether this is the last page.
        first:
          type: boolean
          description: Whether this is the first page.
        size:
          type: integer
          description: Effective page size (number of elements requested per page).
        number:
          type: integer
          description: Zero-based index of the current page.
        number_of_elements:
          type: integer
          description: Number of elements on the current page.
        empty:
          type: boolean
          description: Whether the current page has no content.
        sort:
          $ref: '#/components/schemas/SortDescriptor'
    SortDescriptor:
      type: object
      description: Sort state descriptor returned by Spring Data.
      properties:
        empty:
          type: boolean
          description: Whether no sort orders are applied.
        sorted:
          type: boolean
          description: Whether at least one sort order is applied.
        unsorted:
          type: boolean
          description: Whether no sort orders are applied (inverse of sorted).
    ResearcherPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Researcher'
    SellerPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Seller'
    AnonymousSellerPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AnonymousSellerProfile'
    ManagerPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Manager'
    DemandPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Demand'
    OfferPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Offer'
    ContactUnlockPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ContactUnlock'
    RatingPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            averageRating:
              type: number
              format: float
            totalRatings:
              type: integer
            content:
              type: array
              items:
                $ref: '#/components/schemas/Rating'
    NotificationPageResponse:
      allOf:
        - $ref: '#/components/schemas/PageResponse'
        - type: object
          properties:
            unreadCount:
              type: integer
            content:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      description: Standard error response format
      properties:
        timestamp:
          $ref: '#/components/schemas/DateTime'
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: HTTP status reason phrase
        message:
          type: string
          description: Human-readable error description
        path:
          type: string
          description: Request path that generated the error
        errorCode:
          type: string
          description: Application-specific error code
          enum:
            - AUTHORIZATION_DENIED
            - ENTITY_NOT_FOUND
            - CONSTRAINT_VIOLATION_ON_FIELDS
            - DUPLICATE_ENTITY
            - BAD_FORM
            - MISSING_AUTHORIZATION
            - INVALID_AUTHORIZATION_FORMAT
            - INVALID_TOKEN
            - TOKEN_NOT_FOUND
            - USER_DEACTIVATED
            - AUTHENTICATION_FAILED
            - INTERNAL_SERVER_ERROR
            - MISSING_REQUIRED_PARAMETER
            - INVALID_PARAMETER
            - MALFORMED_JSON
            - METHOD_NOT_ALLOWED
            - ALREADY_UNLOCKED
            - UNLOCK_NOT_PAID
            - REFUND_NOT_ELIGIBLE
            - ONLY_ResearcherS_ALLOWED
            - ONLY_SELLERS_ALLOWED
            - ONLY_MANAGERS_ALLOWED
        details:
          type: object
          description: Additional error context
  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions for requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict or duplicate entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
