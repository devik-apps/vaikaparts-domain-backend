          properties:
            name:
              type: string
            phone_number:
              $ref: '#/components/schemas/PhoneNumber'
            email:
              $ref: '#/components/schemas/EmailAddress'
            profile_img_url:
              type: string
              format: uri
            location:
              $ref: '#/components/schemas/Location'
        seller_contact:
          type: object
          description: Seller contact details (revealed to Researcher after payment)
          nullable: true
          properties:
            name:
              type: string
            phone_number:
              $ref: '#/components/schemas/PhoneNumber'
            email:
              $ref: '#/components/schemas/EmailAddress'
            profile_img_url:
              type: string
              format: uri
            garage_name:
              type: string
            location:
              $ref: '#/components/schemas/Location'
        status:
          $ref: '#/components/schemas/ContactUnlockStatus'
        contact_fee:
          type: number
          format: double
          description: Unlock fee in Malagasy Ariary
        payment_reference:
          type: string
          description: Payment Service reference identifier
        transaction_id:
          type: string
          description: Mobile money transaction reference
          nullable: true
        paid_at:
          $ref: '#/components/schemas/DateTime'
          nullable: true
        confirmed_at:
          $ref: '#/components/schemas/DateTime'
          nullable: true
        confirmation_deadline:
          $ref: '#/components/schemas/DateTime'
          description: Researcher confirmation deadline (48 hours from payment)
          nullable: true
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    PremiumSubscription:
      type: object
      description: Seller premium subscription details
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        sellerId:
          $ref: '#/components/schemas/UUID'
        plan:
          $ref: '#/components/schemas/PremiumPlan'
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED]
        paymentReference:
          type: string
          description: Payment Service reference identifier
        features:
          type: object
          description: Enabled premium features
          properties:
            priorityNotifications:
              type: boolean
              default: true
            additionalChannels:
              type: array
              items:
                $ref: '#/components/schemas/NotificationChannel'
            premiumBadge:
              type: boolean
              default: true
        activatedAt:
          $ref: '#/components/schemas/DateTime'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        autoRenew:
          type: boolean
          default: true
    Rating:
      type: object
      required: [id, sellerId, ResearcherId, unlockId, rating, createdAt]
      description: Seller performance rating
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        sellerId:
          $ref: '#/components/schemas/UUID'
        ResearcherId:
          $ref: '#/components/schemas/UUID'
        unlockId:
          $ref: '#/components/schemas/UUID'
          description: Associated contact unlock transaction
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Numeric rating score
        comment:
          type: string
          maxLength: 500
          description: Optional written feedback
        ResearcherName:
          type: string
          description: Public Researcher name for verification
        createdAt:
          $ref: '#/components/schemas/DateTime'
    RatingCreateRequest:
      type: object
      required: [unlockId, rating]
      description: Rating creation payload
      properties:
        unlockId:
          $ref: '#/components/schemas/UUID'
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
    NotificationPreferences:
      type: object
      description: User notification configuration
      properties:
        newOfferNotification:
          type: boolean
          default: true
          description: Notify Researcher when offer is received
        demandMatchNotification:
          type: boolean
          default: true
          description: Notify seller when matching demand is created
        paymentNotification:
          type: boolean
          default: true
        unlockConfirmationNotification:
          type: boolean
          default: true
        ratingNotification:
          type: boolean
          default: true
          description: Notify seller when rated
        premiumExpiryNotification:
          type: boolean
          default: true
          description: Notify seller before subscription expiry
        channels:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'
          description: Enabled notification delivery channels (premium sellers have extended access)
          default: [IN_APP, PUSH]
    Notification:
      type: object
      required: [id, userId, type, title, message, createdAt, isRead]
      description: User notification record
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        userId:
          $ref: '#/components/schemas/UUID'
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          description: Notification headline
        message:
          type: string
          description: Notification body text
        relatedEntityId:
          $ref: '#/components/schemas/UUID'
          description: Associated entity identifier
        relatedEntityType:
          type: string
          enum: [DEMAND, OFFER, UNLOCK, RATING]
        isRead:
          type: boolean
          default: false
        createdAt:
          $ref: '#/components/schemas/DateTime'
    SellerPublicStatistics:
      type: object
      description: Public seller performance metrics
      properties:
