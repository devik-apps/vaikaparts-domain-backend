    DemandStatus:
      type: string
      description: Lifecycle status of a demand.
      enum:
        - DRAFT
        - PUBLISHED
        - SUSPENDED
        - PENDING
        - CANCELED
      example: PUBLISHED
    Part:
      type: object
      description: Automotive part being sought by the Researcher.
      required: [name, car_brand, car_model, car_year, part_category]
      properties:
        name:
          type: string
          description: Descriptive name of the part.
          example: Headlight
        car_brand:
          type: string
          description: Vehicle manufacturer.
          example: Toyota
        car_model:
          type: string
          description: Vehicle model designation.
          example: Corolla
        car_year:
          type: integer
          description: Four-digit model year of the vehicle.
          minimum: 1900
          maximum: 2100
          example: 2015
        part_category:
          $ref: '#/components/schemas/PartCategory'
        image_urls:
          type: array
          description: >
            Publicly accessible URLs of reference photographs uploaded by the Researcher. Populated server-side after images are stored.

          items:
            type: string
            format: uri
          maxItems: 5
          readOnly: true
    Demand:
      type: object
      description: A Researcher's request for a specific automotive part.
      required: [id, researcher, part, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        description:
          type: string
          description: Additional context or specifications provided by the Researcher.
          example: Looking for headlight
        attached_photos_urls:
          type: array
          description: URLs of photographs attached to the demand.
          items:
            type: string
            format: uri
          maxItems: 5
          readOnly: true
        researcher:
          $ref: '#/components/schemas/Researcher'
        part:
          $ref: '#/components/schemas/Part'
        status:
          $ref: '#/components/schemas/DemandStatus'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        canceled_at:
          $ref: '#/components/schemas/DateTime'
        suspended_at:
          $ref: '#/components/schemas/DateTime'
    DemandCreateRequest:
      type: object
      description: >
        Payload for creating a new demand, submitted as multipart/form-data. Part fields use Spring dot-notation binding (e.g. `part.name`, `part.images`).

      required: [description, part]
      properties:
        description:
          type: string
          description: Additional context or specifications for the sought part.
          maxLength: 1000
          example: Looking for headlight
        part:
          $ref: '#/components/schemas/PartCreateRequest'
    PartCreateRequest:
      type: object
      description: >
        Part details submitted as part of the demand creation multipart request. Fields are bound using Spring dot-notation: `part.name`, `part.car_brand`, etc.

      required: [name, car_brand, car_model, car_year, part_category]
      properties:
        name:
          type: string
          description: Descriptive name of the part.
          example: Headlight
        car_brand:
          type: string
          description: Vehicle manufacturer.
          example: Toyota
        car_model:
          type: string
          description: Vehicle model designation.
          example: Corolla
        car_year:
          type: integer
          description: Four-digit model year of the vehicle.
          minimum: 1900
          maximum: 2100
          example: 2015
        part_category:
          $ref: '#/components/schemas/PartCategory'
        images:
          type: array
          description: >
            Reference photographs of the sought part. Bound under the multipart field name `part.images`. Optional; maximum 5 files.

          items:
            type: string
            format: binary
          maxItems: 5
    Offer:
      type: object
      required: [id, seller_id, parts_info, demand, status, created_at]
      description: Seller response to a Researcher demand.
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        description:
          type: string
          description: Part condition details and additional information.
          maxLength: 1000
        attached_photos_urls:
          type: array
          items:
            type: string
            format: uri
          description: Photographs of the actual part.
          maxItems: 5
          readOnly: true
        seller_id:
          $ref: '#/components/schemas/UUID'
        parts_info:
          $ref: '#/components/schemas/PartInfo'
        demand:
          $ref: '#/components/schemas/Demand'
        status:
          $ref: '#/components/schemas/OfferStatus'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        canceled_at:
          $ref: '#/components/schemas/DateTime'
        suspended_at:
          $ref: '#/components/schemas/DateTime'
    PartInfo:
      type: object
      description: Information about the part offered by the seller, including pricing and condition.
      required: [id, part, price, condition]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        part:
          $ref: '#/components/schemas/Part'
        description:
          type: string
          description: Additional details about the part condition.
          maxLength: 1000
        price:
          type: number
          format: double
          description: Offered price in Malagasy Ariary.
          minimum: 0
        condition:
          $ref: '#/components/schemas/PartCondition'
    OfferCreateRequest:
      type: object
      required: [demand_id, description, part_info]
      description: >
        Payload for creating a new offer, submitted as multipart/form-data. Part info fields use Spring dot-notation binding (e.g. `part_info.name`, `part_info.images`).

      properties:
        demand_id:
          type: string
          description: Identifier of the demand this offer responds to.
          example: "e6b5cc3e-eaaa-4cb3-912c-e059e983bb78"
        description:
          type: string
          description: Additional context or condition details provided by the seller.
          maxLength: 1000
          example: Part is in excellent condition, tested before shipping.
        part_info:
          $ref: '#/components/schemas/PartInfoCreateRequest'
    PartInfoCreateRequest:
      type: object
      description: >
        Part information submitted as part of the offer creation multipart request. Fields are bound using Spring dot-notation: `part_info.name`, `part_info.car_brand`, etc.

      required: [name, car_brand, car_model, car_year, part_category, condition, price]
      properties:
        name:
          type: string
          description: Descriptive name of the part.
          example: Headlight
        car_brand:
          type: string
          description: Vehicle manufacturer.
          example: Toyota
        car_model:
          type: string
          description: Vehicle model designation.
          example: Corolla
        car_year:
          type: integer
          description: Four-digit model year of the vehicle.
          minimum: 1900
          maximum: 2100
          example: 2015
        part_category:
          $ref: '#/components/schemas/PartCategory'
        condition:
          $ref: '#/components/schemas/PartCondition'
        price:
          type: number
          format: double
          description: Offered price in Malagasy Ariary.
          minimum: 0
          example: 150000
        images:
          type: array
          description: >
            Photographs of the offered part. Bound under the multipart field name `part_info.images`. Optional; maximum 5 files.

          items:
            type: string
            format: binary
          maxItems: 5
    OfferUpdateRequest:
      type: object
      description: Offer modification payload
      properties:
        price:
          type: number
          format: double
        condition:
          $ref: '#/components/schemas/PartCondition'
        description:
          type: string
          maxLength: 1000
        image_urls:
          type: array
          items:
            type: string
            format: uri
          maxItems: 5
    ContactUnlock:
      type: object
      required: [id, demand_id, offer_id, researcher_id, seller_id, status, contact_fee, created_at]
      description: Contact information unlock transaction
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        demand_id:
          $ref: '#/components/schemas/UUID'
        offer_id:
          $ref: '#/components/schemas/UUID'
        researcher_id:
          $ref: '#/components/schemas/UUID'
        seller_id:
          $ref: '#/components/schemas/UUID'
